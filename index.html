/* Concept: one-column phone app. Sticky top bar, fixed bottom tab bar, cards on a cool grey ground.
   Teal marks actions and trust, amber marks money and examples. Manrope for everything (has Latin and Cyrillic). */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --line:#E1E6EB; --line-strong:#C9D1D9;
  --fg:#0E1B2B; --muted:#52606F;
  --btn:#0B7A75; --btn-ink:#FFFFFF; --accent:#0B7A75; --accent-soft:#E3F2F1; --accent-ink:#075A56;
  --amber-soft:#FDE9C8; --amber-ink:#7A4300; --blue-soft:#E1ECFA; --blue-ink:#1F4C8F;
  --rose-soft:#FBE5E8; --rose-ink:#8F2A3A; --danger:#B3261E; --bubble-in:#FFFFFF;
  color-scheme:light;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1620; --surface:#16212E; --line:#263545; --line-strong:#34475A;
    --fg:#E8EEF4; --muted:#9AA9B8;
    --btn:#0B7A75; --btn-ink:#FFFFFF; --accent:#5FC4BE; --accent-soft:#14322F; --accent-ink:#8FE0DA;
    --amber-soft:#3A2A10; --amber-ink:#F2C27A; --blue-soft:#16283F; --blue-ink:#9CC3F5;
    --rose-soft:#3A1B21; --rose-ink:#F2A3B0; --danger:#FF8A80; --bubble-in:#1E2C3B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16212E; --line:#263545; --line-strong:#34475A;
  --fg:#E8EEF4; --muted:#9AA9B8;
  --btn:#0B7A75; --btn-ink:#FFFFFF; --accent:#5FC4BE; --accent-soft:#14322F; --accent-ink:#8FE0DA;
  --amber-soft:#3A2A10; --amber-ink:#F2C27A; --blue-soft:#16283F; --blue-ink:#9CC3F5;
  --rose-soft:#3A1B21; --rose-ink:#F2A3B0; --danger:#FF8A80; --bubble-in:#1E2C3B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:var(--font)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{display:flex;align-items:center;gap:8px;min-height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.4px;flex:1;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;background:var(--btn);display:grid;place-items:center;flex:none}
.langs{display:flex}
.lg{min-width:42px;min-height:44px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;border-radius:10px}
.lg.on{color:var(--accent)}
.icon{width:44px;height:44px;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer;margin-left:-10px;flex:none}
.ttl{font-size:17px;font-weight:800;letter-spacing:-.2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;justify-content:space-around}
.tab{flex:1;min-height:60px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;cursor:pointer}
.tab.on{color:var(--accent);font-weight:800}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{min-height:44px;border:0;border-radius:999px;padding:0 18px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line-strong)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.chip{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.teal{background:var(--accent-soft);color:var(--accent-ink)}
.chip.amber{background:var(--amber-soft);color:var(--amber-ink)}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:800;flex:none;letter-spacing:.2px}
.av0{background:var(--accent-soft);color:var(--accent-ink)}.av1{background:var(--amber-soft);color:var(--amber-ink)}
.av2{background:var(--blue-soft);color:var(--blue-ink)}.av3{background:var(--rose-soft);color:var(--rose-ink)}
.av4{background:var(--line);color:var(--fg)}
.who{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;font:inherit;flex:1}
.who .nm{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.who>span:last-child{min-width:0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:10px}
.route{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.3px;flex-wrap:wrap}
.route svg{color:var(--muted);flex:none}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.price{font-weight:800;font-size:18px;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.price small{display:block;font-size:11px;font-weight:600;color:var(--muted);text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.muted{color:var(--muted)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.seg{display:flex;background:var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid var(--line-strong);border-radius:12px;padding:0 12px;background:var(--surface);color:var(--fg);font-size:16px;font-weight:500}
.field textarea{padding:12px;min-height:110px;resize:vertical;line-height:1.45}
.sel{min-height:44px!important;font-size:15px!important}
.err{color:var(--danger);font-weight:700;font-size:13px}
.note{font-size:12px;color:var(--muted);text-align:center}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{max-width:30ch}
.banner{background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-weight:600}
.teaser{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px 6px 10px;color:var(--muted);font-size:15px;cursor:pointer}
.act{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.act button{min-height:44px;min-width:44px;border:0;background:transparent;color:var(--fg);display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:0 10px;cursor:pointer;border-radius:10px}
.act button.liked{color:var(--danger)}
.sp{flex:1}
.msgs{display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:9px 12px;border-radius:16px;overflow-wrap:anywhere;white-space:pre-wrap}
.b.in-{align-self:flex-start;background:var(--bubble-in);border:1px solid var(--line);border-bottom-left-radius:4px}
.b.out{align-self:flex-end;background:var(--btn);color:var(--btn-ink);border-bottom-right-radius:4px}
.b time{display:block;font-size:11px;opacity:.75;margin-top:2px}
.inputbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-block:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.inputbar form{display:flex;gap:8px;align-items:center}
.inputbar input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line-strong);border-radius:23px;padding:0 16px;background:var(--bg);color:var(--fg);font-size:16px}
.send{width:46px;height:46px;border:0;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;cursor:pointer;flex:none}
h2.sec{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.chatrow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.chatrow .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.chatrow .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatrow .ls{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk{height:96px;border-radius:14px;background:var(--line);opacity:.6}
@media (prefers-reduced-motion:no-preference){.card,.chatrow{transition:border-color .15s}}

function viewAuth(){var up=S.authMode==='up';
var h='<div style="padding-top:12px"><h2 style="font-size:24px;font-weight:800;letter-spacing:-.5px">'+esc(t('auth_title'))+'</h2><p class="muted">'+esc(t('auth_sub'))+'</p></div>'
+'<form id="authForm" class="card" autocomplete="on"><div class="field"><label for="aEmail">'+esc(t('email'))+'</label><input id="aEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="none" required></div>'
+'<div class="field"><label for="aPass">'+esc(t('password'))+'</label><input id="aPass" type="password" autocomplete="'+(up?'new-password':'current-password')+'" minlength="6" required></div>'

+'<button class="btn ghost block" type="button" data-act="auth-mode">'+esc(t(up?'have_account':'no_account'))+'</button></form>';

function render(force){
if(!force&&STABLE.indexOf(S.view.name)>=0)return;
var html;
if(S.error)html=shell(barMain(),empty(t(S.error)));
else if(!S.authReady)html=shell(barMain(),loading());
else if(!S.uid)html=viewAuth();
else{switch(S.view.name){
case 'loads':html=viewLoads();break;case 'chats':html=viewChats();break;case 'profile':html=viewProfile();break;
case 'company':html=viewCompany();break;case 'setup':html=viewSetup();break;case 'compose-load':html=viewComposeLoad();break;
case 'compose-post':html=viewComposePost();break;case 'chat':html=viewChat();break;default:html=viewHome()}}
$app.innerHTML=html;
if(S.uid&&S.view.name==='chat')paintMsgs();
}

function pairMsgs(){var o=S.view.other,u=S.uid;return S.allMsgs.filter(function(m){return (m.from===u&&m.to===o)||(m.from===o&&m.to===u)})}
function paintMsgs(){var el=document.getElementById('msgs');if(!el)return;
el.innerHTML=pairMsgs().map(function(m){var out=m.from===S.uid;return '<div class="b '+(out?'out':'in-')+'">'+esc(m.text)+'<time>'+esc(clock(m.at))+'</time></div>'}).join('');
window.scrollTo(0,document.body.scrollHeight)}

/* ---------- navigation ---------- */
function goTab(n){S.stack=[];S.confirmDel='';S.view={name:n};render(true);window.scrollTo(0,0)}
function push(v){S.stack.push(S.view);S.view=v;S.confirmDel='';render(true);window.scrollTo(0,0)}
function back(){S.view=S.stack.pop()||{name:'home'};S.confirmDel='';render(true);window.scrollTo(0,0)}
function needCompany(){if(myCo())return false;push({name:'setup'});return true}
function openChat(other){if(!S.uid||other===S.uid)return;if(needCompany())return;push({name:'chat',other:other})}

/* ---------- data (Supabase) ---------- */
var sb=null,chan=null,timers={};
function later(k,fn){clearTimeout(timers[k]);timers[k]=setTimeout(fn,250)}
function done(name){S.loaded[name]=true;render()}
function loadCompanies(){return sb.from('companies').select('*').then(function(r){
if(r.error){console.warn(r.error);return done('companies')}
var o={};r.data.forEach(function(c){o[c.id]={name:c.name,type:c.type,city:c.city,phone:c.phone||'',about:c.about||'',createdAt:Date.parse(c.created_at)}});S.companies=o;done('companies')})}
function loadPosts(){return sb.from('posts').select('*, post_likes(user_id)').order('created_at',{ascending:false}).limit(60).then(function(r){
if(r.error){console.warn(r.error);return done('posts')}
S.posts=r.data.map(function(p){var likes={};(p.post_likes||[]).forEach(function(x){likes[x.user_id]=true});return {id:p.id,ownerId:p.owner,kind:p.kind,text:p.text,createdAt:Date.parse(p.created_at),likes:likes}});done('posts')})}
function loadLoads(){return sb.from('loads').select('*').order('created_at',{ascending:false}).limit(150).then(function(r){
if(r.error){console.warn(r.error);return done('loads')}
S.loads=r.data.map(function(l){return {id:l.id,ownerId:l.owner,kind:l.kind,from:l.from_city,to:l.to_city,date:l.load_date,truckType:l.truck_type,weight:l.weight,price:l.price,cargo:l.cargo,createdAt:Date.parse(l.created_at)}});done('loads')})}
function deriveChats(){var m={};S.allMsgs.forEach(function(x){var o=x.from===S.uid?x.to:x.from,c=m[o];if(!c||x.at>=c.lastAt)m[o]={id:o,members:[S.uid,o],lastText:x.text,lastAt:x.at,lastFrom:x.from}});
return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.lastAt-a.lastAt})}
function loadMsgs(){return sb.from('messages').select('*').or('sender.eq.'+S.uid+',recipient.eq.'+S.uid).order('created_at',{ascending:true}).limit(1000).then(function(r){
if(r.error){console.warn(r.error);return done('chats')}
S.allMsgs=r.data.map(function(x){return {id:x.id,from:x.sender,to:x.recipient,text:x.text,at:Date.parse(x.created_at)}});S.chats=deriveChats();
if(S.view.name==='chat')paintMsgs();done('chats')})}

function startData(){
loadCompanies();loadPosts();loadLoads();loadMsgs();
chan=sb.channel('alpa')
.on('postgres_changes',{event:'*',schema:'public',table:'companies'},function(){later('c',loadCompanies)})
.on('postgres_changes',{event:'*',schema:'public',table:'posts'},function(){later('p',loadPosts)})
.on('postgres_changes',{event:'*',schema:'public',table:'post_likes'},function(){later('p',loadPosts)})
.on('postgres_changes',{event:'*',schema:'public',table:'loads'},function(){later('l',loadLoads)})
.on('postgres_changes',{event:'*',schema:'public',table:'messages'},function(){later('m',loadMsgs)})
.subscribe()}
function stopData(){if(chan){try{sb.removeChannel(chan)}catch(e){}chan=null}
S.companies={};S.posts=[];S.loads=[];S.allMsgs=[];S.chats=[];S.loaded={companies:false,posts:false,loads:false,chats:false}}

function setSession(sess){var id=sess&&sess.user?sess.user.id:null;
if(S.authReady&&id===S.uid)return;
S.authReady=true;stopData();S.uid=id;S.authMode='in';S.stack=[];S.view={name:id?'home':'auth'};render(true);if(id)setTimeout(startData,0)}

/* ---------- writes ---------- */
function formErr(key,extra){var el=document.getElementById('formErr');if(el)el.textContent=key?t(key)+(extra?': '+extra:''):''}
function val(id){var el=document.getElementById(id);return el?el.value.trim():''}
function failMsg(e){console.warn(e);formErr('save_fail')}
function ok(r){if(r.error){failMsg(r.error);return false}return true}

function doAuth(){var email=val('aEmail'),pw=(document.getElementById('aPass')||{}).value||'',up=S.authMode==='up';
if(!email||pw.length<6){formErr('auth_fail');return}
var call=up?sb.auth.signUp({email:email,password:pw}):sb.auth.signInWithPassword({email:email,password:pw});
call.then(function(r){if(r.error){formErr('auth_fail',r.error.message);return}
if(up&&!(r.data&&r.data.session))formErr('confirm_email')})}

function saveCompany(){var name=val('cName'),city=val('cCity');if(!name||!city){formErr('required');return}
sb.from('companies').upsert({id:S.uid,name:name,type:val('cType')||'carrier',city:city,phone:val('cPhone')||null,about:val('cAbout')||null,updated_at:new Date().toISOString()}).then(function(r){
if(!ok(r))return;return loadCompanies().then(function(){S.stack=[];S.view={name:'profile'};render(true)})})}

function publishLoad(){var from=val('lFrom'),to=val('lTo'),date=val('lDate');
if(!from||!to||!date){formErr('required');return}if(from===to){formErr('bad_route');return}
var w=parseFloat(val('lWeight')),p=parseFloat(val('lPrice')),kind=S.view.kind||'cargo';
sb.from('loads').insert({owner:S.uid,kind:kind,from_city:from,to_city:to,load_date:date,truck_type:val('lTruck')||'other',weight:isFinite(w)&&w>0?w:null,price:isFinite(p)&&p>0?p:null,cargo:val('lCargo')||null}).then(function(r){
if(!ok(r))return;return loadLoads().then(function(){S.kind=kind;S.stack=[];S.view={name:'loads'};render(true);window.scrollTo(0,0)})})}

function publishPost(){var text=val('pText');if(!text){formErr('required');return}
sb.from('posts').insert({owner:S.uid,kind:val('pKind')||'news',text:text}).then(function(r){
if(!ok(r))return;return loadPosts().then(function(){S.stack=[];S.view={name:'home'};render(true);window.scrollTo(0,0)})})}

function toggleLike(id){if(needCompany())return;var p=S.posts.filter(function(x){return x.id===id})[0];if(!p)return;
var q=(p.likes&&p.likes[S.uid])?sb.from('post_likes').delete().eq('post_id',id).eq('user_id',S.uid):sb.from('post_likes').insert({post_id:id,user_id:S.uid});
q.then(function(r){if(r.error)console.warn(r.error);loadPosts()})}

function sendMsg(){var inp=document.getElementById('msgInput'),text=inp.value.trim();if(!text||!S.view.other)return;
inp.value='';inp.focus();
sb.from('messages').insert({sender:S.uid,recipient:S.view.other,text:text.slice(0,2000)}).then(function(r){
if(r.error){console.warn(r.error);inp.value=text;return}loadMsgs()})}

function remove(table,id){sb.from(table).delete().eq('id',id).then(function(r){if(r.error)console.warn(r.error);S.confirmDel='';(table==='loads'?loadLoads():loadPosts()).then(function(){render(true)})})}

/* ---------- events ---------- */
$app.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var a=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
switch(a){
case 'tab':goTab(v);break;
case 'lang':S.lang=v;LS.set('alpa-lang',v);document.documentElement.lang=v;render(true);break;
case 'kind':S.kind=v;render(true);break;
case 'back':back();break;
case 'auth-mode':S.authMode=S.authMode==='up'?'in':'up';render(true);break;
case 'sign-out':sb.auth.signOut();break;
case 'setup':push({name:'setup'});break;
case 'save-company':saveCompany();break;
case 'newload':if(!needCompany())push({name:'compose-load',kind:S.kind});break;
case 'form-kind':S.view.kind=v;document.getElementById('kc').classList.toggle('on',v==='cargo');document.getElementById('kt').classList.toggle('on',v==='truck');
var h1=document.querySelector('.ttl');if(h1)h1.textContent=t(v==='cargo'?'post_cargo':'post_truck');break;
case 'publish-load':publishLoad();break;
case 'newpost':if(!needCompany())push({name:'compose-post'});break;
case 'publish-post':publishPost();break;
case 'company':push({name:'company',id:id});break;
case 'contact':openChat(id);break;
case 'open-chat':openChat(id);break;
case 'like':toggleLike(id);break;
case 'del-load':case 'del-post':var key=a+id;if(S.confirmDel!==key){S.confirmDel=key;render(true)}else remove(a==='del-load'?'loads':'posts',id);break;
}});
$app.addEventListener('change',function(e){var el=e.target.closest('[data-chg]');if(!el)return;
if(el.dataset.chg==='from')S.fromF=el.value;else S.toF=el.value;render(true)});
$app.addEventListener('submit',function(e){e.preventDefault();
if(e.target.id==='msgForm')sendMsg();else if(e.target.id==='authForm')doAuth()});

/* ---------- start ---------- */
(function init(){
document.documentElement.lang=S.lang;
var okCfg=SUPABASE_URL.indexOf('https://')===0&&SUPABASE_KEY.length>20;
if(!okCfg){S.error='no_config';S.authReady=true;render(true);return}
if(!window.supabase){S.error='no_db';S.authReady=true;render(true);return}
render(true);
sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
sb.auth.onAuthStateChange(function(ev,sess){setTimeout(function(){setSession(sess)},0)});
sb.auth.getSession().then(function(r){setSession(r.data&&r.data.session)});
})();
})();
</script>
</body>
</html>
